<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Noto — Habit Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    :root {
      --black:        #0a0a0a;
      --white:        #fafafa;
      --gray-50:      #f9f9f9;
      --gray-100:     #f4f4f4;
      --gray-200:     #e8e8e8;
      --gray-300:     #d0d0d0;
      --gray-400:     #b0b0b0;
      --gray-500:     #888888;
      --gray-700:     #444444;
      --danger:       #c0392b;
      --danger-bg:    #fff5f5;
      --success:      #16a085;
      --font-display: 'DM Serif Display', Georgia, serif;
      --font-body:    'DM Sans', system-ui, sans-serif;
      --radius-sm:    8px;
      --radius-md:    14px;
      --radius-lg:    20px;
      --radius-full:  9999px;
      --shadow-soft:  0 4px 32px rgba(0,0,0,0.08);
      --shadow-card:  0 2px 12px rgba(0,0,0,0.06);
      --shadow-menu:  0 8px 40px rgba(0,0,0,0.14);
      --transition:   all 0.28s cubic-bezier(0.4,0,0.2,1);
      --topbar-h:     72px;
    }

    [data-theme="dark"] { --black: #f0f0f0; --white: #141414; --gray-50: #1a1a1a; --gray-100: #222; --gray-200: #2e2e2e; --gray-300: #444; --gray-400: #666; --gray-500: #999; --gray-700: #ccc; }
    [data-theme="sepia"] { --white: #f5f0e8; --gray-50: #ede8e0; --gray-100: #e5dfd6; --gray-200: #d5cfc6; }

    html, body {
      width:100%; height:100%; overflow:hidden;
      background:var(--white); color:var(--black);
      font-family:var(--font-body); -webkit-font-smoothing:antialiased;
    }

    .app { width:100%; height:100%; display:flex; flex-direction:column; overflow:hidden; }

    .topbar { flex-shrink:0; height:var(--topbar-h); display:flex; align-items:center; justify-content:space-between; padding:0 32px; border-bottom:1px solid var(--gray-200); background:var(--white); z-index:100; }
    .topbar-left  { display:flex; align-items:center; gap:16px; }
    .topbar-right { display:flex; align-items:center; gap:10px; }

    .home-btn { display:flex; align-items:center; gap:8px; padding:8px 14px; border:1px solid var(--gray-200); border-radius:var(--radius-full); background:transparent; font-family:var(--font-body); font-size:13px; font-weight:400; color:var(--gray-500); cursor:pointer; transition:var(--transition); }
    .home-btn:hover { border-color:var(--gray-400); color:var(--black); background:var(--gray-100); }
    .home-btn svg   { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

    .page-title { font-family:var(--font-display); font-size:22px; font-weight:400; color:var(--black); letter-spacing:-0.01em; }

    .icon-btn { width:40px; height:40px; border-radius:var(--radius-full); border:1px solid var(--gray-200); background:var(--white); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:var(--transition); }
    .icon-btn:hover { border-color:var(--gray-400); background:var(--gray-100); }
    .icon-btn svg   { width:18px; height:18px; stroke:var(--gray-500); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:stroke 0.2s; }
    .icon-btn:hover svg { stroke:var(--black); }

    .main-content { flex:1; overflow-y:auto; padding:36px 40px 140px; scroll-behavior:smooth; }
    .main-content::-webkit-scrollbar       { width:4px; }
    .main-content::-webkit-scrollbar-track { background:transparent; }
    .main-content::-webkit-scrollbar-thumb { background:var(--gray-200); border-radius:2px; }

    .section-header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:24px; }
    .section-label  { font-size:11px; font-weight:400; letter-spacing:0.14em; text-transform:uppercase; color:var(--gray-400); }

    /* CONTROLS (Year & Month) */
    .controls-row { display:flex; gap:16px; margin-bottom:24px; align-items:center; }
    .year-picker { display:flex; align-items:center; gap:16px; background:var(--gray-50); padding:8px 16px; border-radius:var(--radius-full); border:1px solid var(--gray-200); }
    .year-btn { cursor:pointer; font-weight:bold; font-size:16px; color:var(--gray-500); user-select:none; transition:var(--transition); }
    .year-btn:hover { color:var(--black); }
    #displayYear { font-family:var(--font-display); font-size:16px; color:var(--black); min-width:40px; text-align:center; }
    
    .month-picker { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; flex:1; }
    .month-picker::-webkit-scrollbar { height: 0; }
    .month-btn { padding:8px 18px; border-radius:var(--radius-full); border:1px solid var(--gray-200); background:var(--white); color:var(--gray-500); cursor:pointer; flex-shrink:0; font-size:13px; font-weight:500; transition:var(--transition); }
    .month-btn:hover { border-color:var(--gray-400); color:var(--black); }
    .month-btn.selected { background:var(--black); color:var(--white); border-color:var(--black); }

    /* MONTHLY GRID VIEW */
    .dashboard-panel { background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-lg); padding:24px 0 24px 24px; margin-bottom:32px; box-shadow:var(--shadow-card); animation:fadeUp 0.4s cubic-bezier(0.4,0,0.2,1); overflow-x:auto; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
    
    .grid-container { display:inline-block; min-width:100%; padding-right:24px; }
    .grid-header { display:grid; grid-template-columns:220px repeat(var(--days, 31), 40px); gap:6px; margin-bottom:12px; border-bottom:1px solid var(--gray-200); padding-bottom:12px; }
    .grid-cell-hdr { text-align:center; font-size:11px; font-weight:500; text-transform:uppercase; color:var(--gray-500); }
    
    /* Sticky First Column */
    .grid-cell-hdr:first-child, .habit-wrapper { position:sticky; left:0; z-index:10; background:var(--white); border-right:1px solid var(--gray-200); text-align:left; padding-right:12px; margin-right:4px; display:flex; align-items:center; }
    
    .grid-row { display:grid; grid-template-columns:220px repeat(var(--days, 31), 40px); gap:6px; align-items:center; margin-bottom:12px; }
    
    .habit-info { display:flex; align-items:center; gap:10px; width:100%; }
    .habit-emoji { font-size:20px; }
    .habit-name { font-size:14px; font-weight:500; color:var(--black); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
    .habit-del { font-size:15px; color:var(--gray-300); cursor:pointer; opacity:0; transition:var(--transition); padding:0 4px; }
    .habit-wrapper:hover .habit-del { opacity:1; color:var(--danger); }
    
    .check-btn { width:40px; height:40px; border-radius:var(--radius-sm); border:1.5px solid var(--gray-200); background:var(--gray-50); cursor:pointer; transition:var(--transition); display:flex; align-items:center; justify-content:center; }
    .check-btn:hover { border-color:var(--gray-400); }
    .check-btn.done { background:var(--black); border-color:var(--black); }
    .check-btn svg { width:16px; height:16px; stroke:var(--white); fill:none; stroke-width:3; stroke-linecap:round; display:none; }
    .check-btn.done svg { display:block; }

    /* MONTHLY/YEARLY STATS */
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin-bottom:40px; }
    .stat-card { background:var(--gray-50); border:1px solid var(--gray-200); border-radius:var(--radius-md); padding:24px; transition:var(--transition); }
    .stat-card:hover { border-color:var(--gray-400); transform:translateY(-2px); }
    .stat-value { font-family:var(--font-display); font-size:36px; color:var(--black); margin-bottom:4px; line-height:1; }
    .stat-label { font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.12em; color:var(--gray-500); }

    /* MODAL SYSTEM (from Noto Design) */
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:500; display:none; align-items:center; justify-content:center; backdrop-filter:blur(3px); }
    .modal-backdrop.visible { display:flex; }
    .modal { background:var(--white); border-radius:var(--radius-lg); padding:32px; width:440px; max-width:92vw; box-shadow:0 24px 64px rgba(0,0,0,0.18); animation:modalIn 0.25s cubic-bezier(0.4,0,0.2,1); }
    @keyframes modalIn { from{opacity:0;transform:scale(0.96) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
    .modal-title    { font-family:var(--font-display); font-size:22px; font-weight:400; margin-bottom:6px; color:var(--black); }
    .modal-subtitle { font-size:13px; color:var(--gray-500); margin-bottom:24px; line-height:1.6; }
    .input-group  { margin-bottom:16px; }
    .input-label  { display:block; font-size:11px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--gray-500); margin-bottom:8px; }
    .input-field  { width:100%; padding:13px 16px; border:1px solid var(--gray-200); border-radius:var(--radius-md); font-family:var(--font-body); font-size:15px; font-weight:400; color:var(--black); background:var(--white); outline:none; transition:border-color 0.2s; }
    .input-field:focus { border-color:var(--black); }
    .modal-actions  { display:flex; gap:10px; justify-content:flex-end; margin-top:4px; }
    .btn-secondary  { padding:11px 22px; border:1px solid var(--gray-200); border-radius:var(--radius-full); background:var(--white); font-family:var(--font-body); font-size:13px; font-weight:500; color:var(--gray-700); cursor:pointer; }
    .btn-secondary:hover { background:var(--gray-100); }
    .btn-confirm    { padding:11px 22px; border:none; border-radius:var(--radius-full); background:var(--black); font-family:var(--font-body); font-size:13px; font-weight:500; color:var(--white); cursor:pointer; }
    .btn-confirm:hover { background:var(--gray-700); }

    .toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--black); color:var(--white); font-size:13px; padding:12px 22px; border-radius:var(--radius-full); z-index:9999; opacity:0; transition:all 0.3s cubic-bezier(0.4,0,0.2,1); pointer-events:none; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    
    .empty-state { padding: 40px; text-align:left; color:var(--gray-400); font-size:14px; }
  </style>
</head>
<body>

  <!-- ADD HABIT MODAL -->
  <div class="modal-backdrop" id="addModal">
    <div class="modal">
      <h2 class="modal-title">New Protocol ⚡</h2>
      <p  class="modal-subtitle">Define a new daily protocol or habit you want to track.</p>
      <div class="input-group">
        <label class="input-label">Protocol Name</label>
        <input class="input-field" id="habitNameInput" type="text" placeholder="e.g. 1hr Deep Work, Meditate..." autocomplete="off">
      </div>
      <div class="input-group">
        <label class="input-label">Emoji Icon</label>
        <input class="input-field" id="habitEmojiInput" type="text" placeholder="🏃" maxlength="2" style="width:80px; text-align:center;" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeAddModal()">Cancel</button>
        <button class="btn-confirm" onclick="confirmHabit()">Create</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="app">
    <header class="topbar">
      <div class="topbar-left">
        <button class="home-btn" onclick="notoNavigate('index.html')">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </button>
        <h1 class="page-title">Habits Dashboard</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" onclick="openAddModal()" title="Add Habit">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="icon-btn" onclick="notoNavigate('settings.html')" title="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <main class="main-content">
      
      <div class="section-header">
        <span class="section-label">📊 Productivity Overview</span>
      </div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" id="statMonth">0%</div><div class="stat-label">Monthly Productivity</div></div>
        <div class="stat-card"><div class="stat-value" id="statYear">0%</div><div class="stat-label">Yearly Productivity</div></div>
        <div class="stat-card"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total Check-ins</div></div>
      </div>

      <div class="section-header">
        <span class="section-label">📅 Monthly Tracking Calendar</span>
      </div>
      
      <!-- CONTROLS -->
      <div class="controls-row">
        <div class="year-picker">
          <span class="year-btn" onclick="changeYear(-1)">&lsaquo;</span>
          <span id="displayYear">2026</span>
          <span class="year-btn" onclick="changeYear(1)">&rsaquo;</span>
        </div>
        <div class="month-picker" id="monthPicker">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="dashboard-panel">
        <div class="grid-container" id="gridContainer">
          <div class="grid-header" id="gridHeader">
            <div class="grid-cell-hdr">Protocol</div>
            <!-- Days populated dynamically -->
          </div>
          <div id="gridBody">
            <!-- Habit rows dynamically inserted -->
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="js/renderer.js"></script>
  <script src="js/keyboard.js"></script>

  <script>
    const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    let selYear = new Date().getFullYear();
    let selMonth = new Date().getMonth(); // 0-11

    function initControls() {
      // Month picker
      const mp = document.getElementById('monthPicker');
      mp.innerHTML = '';
      MONTH_NAMES.forEach((m, idx) => {
        const btn = document.createElement('div');
        btn.className = 'month-btn' + (idx === selMonth ? ' selected' : '');
        btn.textContent = m;
        btn.onclick = () => { selMonth = idx; initControls(); loadDashboard(); };
        mp.appendChild(btn);
      });
      // Year picker
      document.getElementById('displayYear').textContent = selYear;
    }

    function changeYear(delta) {
      selYear += delta;
      initControls();
      loadDashboard();
    }

    // Number of days in selected month/year. Day 0 of next month = last day of this month.
    function getDaysInMonth(year, monthIndex) {
      return new Date(year, monthIndex + 1, 0).getDate();
    }

    // Utility: Is it a leap year?
    function isLeapYear(year) {
      return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
    }

    async function loadDashboard() {
      const defs = await notoLoadHabitDefs();
      const logs = await notoLoadHabitLogs();
      const daysCount = getDaysInMonth(selYear, selMonth);
      
      const containerStyle = document.getElementById('gridHeader').style;
      containerStyle.setProperty('--days', daysCount);
      
      const header = document.getElementById('gridHeader');
      header.innerHTML = '<div class="grid-cell-hdr">Protocol Name</div>';
      
      for(let d=1; d<=daysCount; d++) {
        header.innerHTML += `<div class="grid-cell-hdr">${d}</div>`;
      }

      const body = document.getElementById('gridBody');
      body.innerHTML = '';

      if (defs.length === 0) {
        body.innerHTML = '<div class="empty-state">No protocols active right now. Tap the + icon to add a habit.</div>';
      }

      const monthPrefix = selYear + '-' + String(selMonth + 1).padStart(2, '0');
      let totalCheckins = 0;
      let yearCheckins = 0;
      let monthCheckins = 0;
      
      // Calculate Stats safely
      defs.forEach(h => {
        const logMap = logs[h.id] || {};
        Object.keys(logMap).forEach(dStr => {
           if(logMap[dStr]) {
             totalCheckins++;
             if(dStr.startsWith(String(selYear))) yearCheckins++;
             if(dStr.startsWith(monthPrefix)) monthCheckins++;
           }
        });
      });

      // Render Grid
      defs.forEach(habit => {
        const row = document.createElement('div');
        row.className = 'grid-row';
        row.style.setProperty('--days', daysCount);
        
        row.innerHTML = `<div class="habit-wrapper">
                           <div class="habit-info">
                             <span class="habit-emoji">${habit.emoji}</span>
                             <span class="habit-name">${notoEsc(habit.name)}</span>
                             <span class="habit-del" onclick="deleteHabit('${habit.id}')">&times;</span>
                           </div>
                         </div>`;
        
        for(let d=1; d<=daysCount; d++) {
          const iso = monthPrefix + '-' + String(d).padStart(2, '0');
          const isDone = logs[habit.id] && logs[habit.id][iso];

          const btn = document.createElement('div');
          btn.className = 'check-btn' + (isDone ? ' done' : '');
          btn.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`;
          btn.onclick = async () => {
            await notoToggleHabitLog(habit.id, iso);
            loadDashboard(); // re-render stat check
          };
          row.appendChild(btn);
        }

        body.appendChild(row);
      });

      // Update Productivity
      document.getElementById('statTotal').innerText = totalCheckins;
      
      const numHabits = defs.length;
      if (numHabits === 0) {
        document.getElementById('statMonth').innerText = '0%';
        document.getElementById('statYear').innerText = '0%';
      } else {
        const possibleMon = numHabits * daysCount;
        const possibleYr = numHabits * (isLeapYear(selYear) ? 366 : 365);
        document.getElementById('statMonth').innerText = Math.round((monthCheckins / possibleMon) * 100) + '%';
        document.getElementById('statYear').innerText = Math.round((yearCheckins / possibleYr) * 100) + '%';
      }
    }

    function openAddModal() {
      document.getElementById('habitNameInput').value = '';
      document.getElementById('habitEmojiInput').value = '✅';
      document.getElementById('addModal').classList.add('visible');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('visible');
    }

    async function confirmHabit() {
      const name = document.getElementById('habitNameInput').value.trim();
      const emoji = document.getElementById('habitEmojiInput').value.trim();
      if (!name) return notoToast('Please enter a protocol name');
      
      await notoAddHabitDef(name, emoji);
      closeAddModal();
      loadDashboard();
      notoToast('Protocol tracking started! 🔥');
    }

    async function deleteHabit(id) {
      if(confirm('Delete this habit and all history?')) {
        await notoDeleteHabitDef(id);
        loadDashboard();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initControls();
      loadDashboard();
    });
  </script>
</body>
</html>
