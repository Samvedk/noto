<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Noto — Welcome</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="paper-glass.css">
</head>
<body class="pg-splash-screen">
  <div class="pg-transition-overlay" id="transitionOverlay"></div>

  <div class="pg-splash-corner tl"></div>
  <div class="pg-splash-corner br"></div>
  <span class="pg-splash-version">Noto OS</span>

  <div class="pg-splash-hero">
    <div class="pg-splash-logo">
      <svg viewBox="0 0 24 24">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
    </div>
    <h1 class="pg-splash-title">Noto</h1>
    <p class="pg-splash-byline">Premium Productivity</p>

    <div class="pg-splash-divider"></div>

    <div class="pg-splash-quote" id="quoteBlock">
      <p class="pg-splash-quote-text" id="quoteText"></p>
      <p class="pg-splash-quote-author" id="quoteAuthor"></p>
    </div>

    <div class="pg-splash-cta">
      <button class="pg-btn-primary" id="startBtn" onclick="notoNavigate('grade.html')">
        Open Workspace
        <svg style="width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </div>
  </div>

  <footer class="pg-splash-footer">
    <span class="pg-splash-footer-text">Offline</span>
    <span class="pg-splash-footer-text" id="currentTime">
      <span id="clockH">--</span><span class="pg-clock-sep">:</span><span id="clockM">--</span>
    </span>
  </footer>

  <script src="js/renderer.js"></script>
  <script>
    /* ── QUOTES ── */
    const QUOTES = [
      { text: "The secret to doing it all is knowing that you can't. Prioritise. Then go.", author: "Robert Downey Jr." },
      { text: "The people who are crazy enough to think they can change the world are the ones who do.", author: "Steve Jobs" },
      { text: "I think it is possible for ordinary people to choose to be extraordinary.", author: "Elon Musk" },
      { text: "The best way to predict the future is to invent it.", author: "Alan Kay" },
      { text: "Dream, dream, dream. Dreams transform into thoughts, and thoughts into action.", author: "APJ Abdul Kalam" },
      { text: "Sometimes you gotta run before you can walk.", author: "Tony Stark" },
      { text: "Knowledge is the new currency. Write it down.", author: "Noto" },
    ];

    function renderQuote() {
      const q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
      document.getElementById('quoteText').textContent = '\u201C' + q.text + '\u201D';
      document.getElementById('quoteAuthor').textContent = '— ' + q.author;
    }

    /* ── CLOCK ── */
    function updateClock() {
      const n = new Date();
      document.getElementById('clockH').textContent = String(n.getHours()).padStart(2, '0');
      document.getElementById('clockM').textContent = String(n.getMinutes()).padStart(2, '0');
    }

    /* ── TRANSITION OVERLAY ── */
    (function initTransition() {
      const o = document.getElementById('transitionOverlay');
      o.style.cssText = 'transition:none; transform:translateX(0%); pointer-events:none;';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          o.style.cssText = 'transition:transform 0.44s cubic-bezier(0.7,0,0.3,1); transform:translateX(-100%); pointer-events:none;';
        });
      });
    })();

    document.addEventListener('DOMContentLoaded', async () => {
      renderQuote();
      updateClock();
      setInterval(updateClock, 1000);

      await notoMigrateIfNeeded();
      const s = await notoLoadSettings();
      notoApplyTheme(s.theme);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    });
  </script>
</body>
</html>
