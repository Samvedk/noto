<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noto — Notebooks</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    :root {
      --black:        #0a0a0a;
      --white:        #fafafa;
      --gray-50:      #f9f9f9;
      --gray-100:     #f4f4f4;
      --gray-200:     #e8e8e8;
      --gray-300:     #d0d0d0;
      --gray-400:     #b0b0b0;
      --gray-500:     #888888;
      --gray-700:     #444444;
      --danger:       #c0392b;
      --danger-bg:    #fff5f5;
      --font-display: 'DM Serif Display', Georgia, serif;
      --font-body:    'DM Sans', system-ui, sans-serif;
      --radius-sm:    8px;
      --radius-md:    14px;
      --radius-lg:    20px;
      --radius-xl:    28px;
      --radius-full:  9999px;
      --shadow-soft:  0 4px 32px rgba(0,0,0,0.08);
      --shadow-card:  0 2px 12px rgba(0,0,0,0.06);
      --shadow-menu:  0 8px 40px rgba(0,0,0,0.14);
      --transition:   all 0.28s cubic-bezier(0.4,0,0.2,1);
      --topbar-h:     72px;
    }

    [data-theme="dark"] {
      --black:    #f0f0f0;
      --white:    #141414;
      --gray-50:  #1a1a1a;
      --gray-100: #222222;
      --gray-200: #2e2e2e;
      --gray-300: #444444;
      --gray-400: #666666;
      --gray-500: #999999;
      --gray-700: #cccccc;
    }

    [data-theme="sepia"] {
      --white:    #f5f0e8;
      --gray-50:  #ede8e0;
      --gray-100: #e5dfd6;
      --gray-200: #d5cfc6;
    }

    html, body {
      width:100%; height:100%; overflow:hidden;
      background:var(--white); color:var(--black);
      font-family:var(--font-body); -webkit-font-smoothing:antialiased;
    }

    .app { width:100%; height:100%; display:flex; flex-direction:column; overflow:hidden; }

    .topbar {
      flex-shrink:0; height:var(--topbar-h);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 32px;
      border-bottom:1px solid var(--gray-200);
      background:var(--white); z-index:100; gap:16px;
    }

    .topbar-left  { display:flex; align-items:center; gap:14px; flex-shrink:0; }
    .topbar-right { display:flex; align-items:center; gap:10px; flex-shrink:0; }

    .back-btn {
      display:flex; align-items:center; gap:7px;
      padding:8px 14px;
      border:1px solid var(--gray-200); border-radius:var(--radius-full);
      background:transparent; font-family:var(--font-body);
      font-size:13px; font-weight:400; color:var(--gray-500);
      cursor:pointer; transition:var(--transition);
    }

    .back-btn:hover { border-color:var(--gray-400); color:var(--black); background:var(--gray-100); }
    .back-btn svg   { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

    .breadcrumb         { display:flex; align-items:center; gap:8px; }
    .breadcrumb-grade   { font-size:12px; color:var(--gray-400); font-weight:300; }
    .breadcrumb-sep     { font-size:12px; color:var(--gray-300); }
    .breadcrumb-subject { font-size:13px; color:var(--gray-500); font-weight:400; }
    .breadcrumb-current { font-family:var(--font-display); font-size:20px; font-weight:400; color:var(--black); letter-spacing:-0.01em; }

    .icon-btn { width:40px; height:40px; border-radius:var(--radius-full); border:1px solid var(--gray-200); background:var(--white); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:var(--transition); }
    .icon-btn:hover { border-color:var(--gray-400); background:var(--gray-100); }
    .icon-btn svg   { width:17px; height:17px; stroke:var(--gray-500); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:stroke 0.2s; }
    .icon-btn:hover svg { stroke:var(--black); }

    .main-content { flex:1; overflow-y:auto; padding:36px 40px 140px; scroll-behavior:smooth; }
    .main-content::-webkit-scrollbar       { width:4px; }
    .main-content::-webkit-scrollbar-track { background:transparent; }
    .main-content::-webkit-scrollbar-thumb { background:var(--gray-200); border-radius:2px; }

    .section-header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:24px; }
    .section-label  { font-size:11px; font-weight:400; letter-spacing:0.14em; text-transform:uppercase; color:var(--gray-400); }
    .section-count  { font-size:11px; color:var(--gray-400); }

    .notebooks-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
      gap:16px;
    }

    .notebook-card {
      position:relative;
      background:var(--white);
      border:1px solid var(--gray-200);
      border-radius:var(--radius-xl);
      cursor:pointer;
      transition:var(--transition);
      box-shadow:var(--shadow-card);
      overflow:visible;
      animation:cardIn 0.4s cubic-bezier(0.4,0,0.2,1) backwards;
      user-select:none;
    }

    .notebook-card:nth-child(1){animation-delay:.04s} .notebook-card:nth-child(2){animation-delay:.08s}
    .notebook-card:nth-child(3){animation-delay:.12s} .notebook-card:nth-child(4){animation-delay:.16s}
    .notebook-card:nth-child(5){animation-delay:.20s} .notebook-card:nth-child(6){animation-delay:.24s}

    @keyframes cardIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    .notebook-card:hover    { border-color:var(--gray-400); box-shadow:var(--shadow-soft); transform:translateY(-3px); }
    .notebook-card.menu-open { border-color:var(--black); box-shadow:0 0 0 2px var(--black); transform:translateY(-3px); }

    .card-menu-btn {
      position:absolute; top:12px; right:12px;
      width:32px; height:32px;
      border-radius:var(--radius-full);
      border:none; background:transparent;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:var(--transition);
      opacity:0; z-index:10;
    }

    @media (hover:none) { .card-menu-btn { opacity:1; } }

    .notebook-card:hover .card-menu-btn,
    .notebook-card.menu-open .card-menu-btn { opacity:1; }

    .card-menu-btn:hover { background:rgba(255,255,255,0.9); }
    .card-menu-btn svg   { width:15px; height:15px; stroke:var(--gray-500); fill:none; stroke-width:2; stroke-linecap:round; transition:stroke 0.2s; }
    .card-menu-btn:hover svg { stroke:var(--black); }

    .card-spine {
      position:absolute; top:0; left:0; bottom:0; width:6px;
      background:var(--black);
      border-radius:var(--radius-xl) 0 0 var(--radius-xl);
    }

    .card-cover {
      height:110px; margin-left:6px;
      background:var(--gray-50);
      display:flex; align-items:center; justify-content:center;
      border-bottom:1px solid var(--gray-200);
      position:relative; overflow:hidden;
    }

    .card-cover::after {
      content:''; position:absolute; inset:0;
      background:repeating-linear-gradient(180deg, transparent, transparent 19px, rgba(0,0,0,0.04) 19px, rgba(0,0,0,0.04) 20px);
    }

    .card-cover-emoji { font-size:38px; position:relative; z-index:1; }

    .card-body { padding:18px 20px 16px; margin-left:6px; }

    .card-name { font-family:var(--font-display); font-size:18px; font-weight:400; color:var(--black); letter-spacing:-0.01em; margin-bottom:4px; line-height:1.2; padding-right:28px; }
    .card-meta { font-size:12px; color:var(--gray-400); font-weight:300; margin-bottom:14px; }

    .card-footer { display:flex; align-items:center; justify-content:space-between; padding-top:12px; border-top:1px solid var(--gray-100); }

    .card-stats { display:flex; gap:8px; flex-wrap:wrap; }

    .stat-pill {
      display:inline-flex; align-items:center; gap:4px;
      padding:3px 9px;
      background:var(--gray-100); border-radius:var(--radius-full);
      font-size:11px; color:var(--gray-500);
    }

    .card-arrow { width:28px; height:28px; border-radius:var(--radius-full); background:var(--gray-100); display:flex; align-items:center; justify-content:center; transition:var(--transition); }
    .notebook-card:hover .card-arrow { background:var(--black); }
    .card-arrow svg { width:12px; height:12px; stroke:var(--gray-500); fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; transition:stroke 0.2s; }
    .notebook-card:hover .card-arrow svg { stroke:var(--white); }

    .notebook-card-add {
      background:transparent;
      border:1.5px dashed var(--gray-300);
      border-radius:var(--radius-xl);
      min-height:200px;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:10px; cursor:pointer;
      transition:var(--transition); text-align:center;
    }

    .notebook-card-add:hover { border-color:var(--black); background:var(--gray-50); }

    .add-icon { width:44px; height:44px; border-radius:var(--radius-full); background:var(--gray-100); display:flex; align-items:center; justify-content:center; transition:var(--transition); }
    .notebook-card-add:hover .add-icon { background:var(--black); }
    .add-icon svg { width:18px; height:18px; stroke:var(--gray-500); fill:none; stroke-width:2; stroke-linecap:round; transition:stroke 0.2s; }
    .notebook-card-add:hover .add-icon svg { stroke:var(--white); }
    .add-label { font-size:13px; font-weight:400; color:var(--gray-500); transition:color 0.2s; }
    .notebook-card-add:hover .add-label { color:var(--black); }

    .action-menu { position:fixed; background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-md); box-shadow:var(--shadow-menu); padding:6px; z-index:2000; min-width:200px; display:none; animation:menuPop 0.18s cubic-bezier(0.4,0,0.2,1); transform-origin:top right; }
    .action-menu.visible { display:block; }
    @keyframes menuPop { from{opacity:0;transform:scale(0.92)} to{opacity:1;transform:scale(1)} }

    .action-item { display:flex; align-items:center; gap:11px; padding:11px 14px; border-radius:var(--radius-sm); font-size:14px; font-weight:400; color:var(--black); cursor:pointer; transition:background 0.15s; border:none; background:none; width:100%; text-align:left; font-family:var(--font-body); }
    .action-item:hover        { background:var(--gray-100); }
    .action-item.danger       { color:var(--danger); }
    .action-item.danger:hover { background:var(--danger-bg); }
    .action-item svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .action-divider { height:1px; background:var(--gray-200); margin:5px 0; }

    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:500; display:none; align-items:center; justify-content:center; backdrop-filter:blur(3px); }
    .modal-backdrop.visible { display:flex; }
    .modal { background:var(--white); border-radius:var(--radius-lg); padding:32px; width:460px; max-width:92vw; box-shadow:0 24px 64px rgba(0,0,0,0.18); animation:modalIn 0.25s cubic-bezier(0.4,0,0.2,1); }
    @keyframes modalIn { from{opacity:0;transform:scale(0.96) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }

    .modal-title    { font-family:var(--font-display); font-size:22px; font-weight:400; margin-bottom:6px; color:var(--black); }
    .modal-subtitle { font-size:13px; color:var(--gray-500); margin-bottom:24px; line-height:1.6; }

    .input-group  { margin-bottom:16px; }
    .input-label  { display:block; font-size:11px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--gray-500); margin-bottom:8px; }
    .input-field  { width:100%; padding:13px 16px; border:1px solid var(--gray-200); border-radius:var(--radius-md); font-family:var(--font-body); font-size:15px; font-weight:400; color:var(--black); background:var(--white); outline:none; transition:border-color 0.2s; caret-color:var(--black); }
    .input-field:focus        { border-color:var(--black); }
    .input-field::placeholder { color:var(--gray-400); }

    .type-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:24px; }
    .type-opt {
      padding:12px 14px;
      border:1.5px solid var(--gray-200); border-radius:var(--radius-md);
      cursor:pointer; transition:var(--transition);
      text-align:center; font-family:var(--font-body);
      background:var(--white);
    }
    .type-opt:hover    { border-color:var(--gray-400); background:var(--gray-50); }
    .type-opt.selected { border-color:var(--black); background:var(--black); color:var(--white); }
    .type-opt-emoji { font-size:20px; display:block; margin-bottom:4px; }
    .type-opt-label { font-size:12px; font-weight:500; letter-spacing:0.04em; }

    .emoji-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
    .emoji-opt { width:44px; height:44px; border-radius:var(--radius-sm); border:1.5px solid var(--gray-200); background:var(--gray-50); font-size:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:var(--transition); }
    .emoji-opt:hover, .emoji-opt.selected { border-color:var(--black); background:var(--gray-100); transform:scale(1.08); }

    .modal-actions  { display:flex; gap:10px; justify-content:flex-end; margin-top:4px; }
    .btn-secondary  { padding:11px 22px; border:1px solid var(--gray-200); border-radius:var(--radius-full); background:var(--white); font-family:var(--font-body); font-size:13px; font-weight:500; color:var(--gray-700); cursor:pointer; transition:var(--transition); }
    .btn-secondary:hover { border-color:var(--gray-400); background:var(--gray-100); }
    .btn-confirm    { padding:11px 22px; border:none; border-radius:var(--radius-full); background:var(--black); font-family:var(--font-body); font-size:13px; font-weight:500; color:var(--white); cursor:pointer; transition:var(--transition); }
    .btn-confirm:hover { background:var(--gray-700); }
    .btn-danger     { padding:11px 22px; border:none; border-radius:var(--radius-full); background:var(--danger); font-family:var(--font-body); font-size:13px; font-weight:500; color:var(--white); cursor:pointer; transition:var(--transition); }
    .btn-danger:hover    { background:#a93226; }
    .btn-danger:disabled { opacity:0.4; cursor:not-allowed; }

    .delete-note        { font-size:13px; color:var(--gray-500); margin-bottom:12px; line-height:1.6; }
    .delete-note strong { color:var(--danger); font-weight:600; }

    .empty-state      { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; text-align:center; color:var(--gray-400); grid-column:1/-1; }
    .empty-state-icon { font-size:48px; margin-bottom:16px; }
    .empty-state-text { font-size:14px; font-weight:300; line-height:1.7; }

    .toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--black); color:var(--white); font-size:13px; padding:12px 22px; border-radius:var(--radius-full); z-index:9999; opacity:0; transition:all 0.3s cubic-bezier(0.4,0,0.2,1); pointer-events:none; white-space:nowrap; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    .transition-overlay { position:fixed; inset:0; background:var(--black); z-index:99998; transform:translateY(-200%); transition:transform 0.5s cubic-bezier(0.7,0,0.3,1); pointer-events:none; }
    .transition-overlay.active { transform:translateY(0%); pointer-events:all; }
  </style>
</head>
<body>

  <div class="transition-overlay" id="transitionOverlay"></div>

  <div class="action-menu" id="actionMenu">
    <button class="action-item" id="menuRename">
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Rename
    </button>
    <div class="action-divider"></div>
    <button class="action-item danger" id="menuDelete">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      Delete Notebook
    </button>
  </div>

  <div class="modal-backdrop" id="addModal">
    <div class="modal">
      <h2 class="modal-title"    id="modalTitle">Add Notebook 📓</h2>
      <p  class="modal-subtitle" id="modalSubtitle">Create a notebook for this subject. It supports up to 700 pages.</p>
      <div class="input-group">
        <label class="input-label">Notebook Name</label>
        <input class="input-field" id="notebookNameInput" type="text" placeholder="e.g. Physics Theory, Lab Record…" maxlength="50" autocomplete="off" />
      </div>
      <label class="input-label" id="typeSectionLabel">Notebook Type</label>
      <div class="type-grid" id="typeGrid"></div>
      <label class="input-label">Cover Emoji</label>
      <div class="emoji-row" id="emojiRow"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeAddModal()">Cancel</button>
        <button class="btn-confirm"   id="modalConfirmBtn" onclick="confirmNotebook()">Create</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="deleteModal">
    <div class="modal">
      <h2 class="modal-title">Delete Notebook 🗑️</h2>
      <p  class="modal-subtitle">This permanently removes the notebook and all its pages. This cannot be undone.</p>
      <p  class="delete-note">Type <strong>delete</strong> below to confirm.</p>
      <div class="input-group">
        <input class="input-field" id="deleteConfirmInput" type="text" placeholder="Type delete to confirm…" autocomplete="off" />
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn-danger" id="deleteConfirmBtn" onclick="confirmDelete()" disabled>Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="app">
    <header class="topbar">
      <div class="topbar-left">
        <button class="back-btn" onclick="notoNavigate('subject.html')">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Subjects
        </button>
        <div class="breadcrumb">
          <span class="breadcrumb-grade"   id="gradeName">—</span>
          <span class="breadcrumb-sep">›</span>
          <span class="breadcrumb-subject" id="subjectName">—</span>
          <span class="breadcrumb-sep">›</span>
          <span class="breadcrumb-current">Notebooks</span>
        </div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" onclick="openAddModal()" title="Add Notebook"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        <button class="icon-btn" onclick="notoNavigate('settings.html')" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      </div>
    </header>

    <main class="main-content">
      <div class="section-header">
        <span class="section-label">📓 Notebooks</span>
        <span class="section-count" id="notebookCount">0 notebooks</span>
      </div>
      <div class="notebooks-grid" id="notebooksGrid"></div>
    </main>
  </div>

  <script src="renderer.js"></script>
  <script src="keyboard.js"></script>

  <script>
    const currentGradeId   = notoGetCurrentGrade();
    const currentSubjectId = notoGetCurrentSubject();

    let selectedEmoji = '📓';
    let selectedType  = 'theory';
    let editMode      = false;
    let contextTarget = null;

    const EMOJIS = ['📓','📒','📔','📕','📗','📘','📙','🗒️','✏️','🔬','📐','🧪','🎨','💻','📊'];
    const NOTEBOOK_TYPES = [
      { id:'theory',     emoji:'📖', label:'Theory'     },
      { id:'practical',  emoji:'🧪', label:'Practical'  },
      { id:'assignment', emoji:'📝', label:'Assignment' },
      { id:'revision',   emoji:'🔄', label:'Revision'   },
    ];

    async function init() {
      if (!currentGradeId)   { notoNavigate('grade.html');   return; }
      if (!currentSubjectId) { notoNavigate('subject.html'); return; }

      const grades    = await notoLoadGrades();
      const gradeObj  = grades.find(g => g.id === currentGradeId);
      const subjects  = await notoLoadSubjects(currentGradeId);
      const subjectObj = subjects.find(s => s.id === currentSubjectId);

      if (gradeObj)   document.getElementById('gradeName').textContent   = gradeObj.name;
      if (subjectObj) document.getElementById('subjectName').textContent = subjectObj.name;

      await render();
    }

    async function render() {
      const notebooks = await notoLoadNotebooks(currentSubjectId);
      const grid      = document.getElementById('notebooksGrid');
      const count     = document.getElementById('notebookCount');

      count.textContent = notebooks.length + (notebooks.length === 1 ? ' notebook' : ' notebooks');
      grid.innerHTML    = '';

      if (notebooks.length === 0) {
        grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📓</div><div class="empty-state-text">No notebooks yet.<br>Tap + to create your first notebook.</div></div>`;
      }

      notebooks.forEach(nb => {
        const card      = document.createElement('div');
        card.className  = 'notebook-card';
        card.dataset.id = nb.id;
        const typeObj   = NOTEBOOK_TYPES.find(t => t.id === nb.type) || NOTEBOOK_TYPES[0];
        const pageCount = nb.pageCount || 1;

        card.innerHTML = `
          <button class="card-menu-btn" data-id="${nb.id}" title="Options"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="19" r="1.2" fill="currentColor"/></svg></button>
          <div class="card-spine"></div>
          <div class="card-cover"><span class="card-cover-emoji">${nb.emoji}</span></div>
          <div class="card-body">
            <div class="card-name">${notoEsc(nb.name)}</div>
            <div class="card-meta">Last edited ${nb.lastEdited || 'never'}</div>
            <div class="card-footer">
              <div class="card-stats">
                <span class="stat-pill">📄 ${pageCount} / 700 pg</span>
                <span class="stat-pill">🏷️ ${typeObj.label}</span>
              </div>
              <div class="card-arrow"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
            </div>
          </div>`;

        card.addEventListener('click', e => {
          if (e.target.closest('.card-menu-btn')) return;
          notoSetCurrentNb(nb.id);
          notoNavigate('page.html');
        });

        card.querySelector('.card-menu-btn').addEventListener('click', e => {
          e.stopPropagation();
          openActionMenu(e, nb.id);
        });

        grid.appendChild(card);
      });

      const addCard = document.createElement('div');
      addCard.className = 'notebook-card-add';
      addCard.innerHTML = `<div class="add-icon"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><span class="add-label">Add Notebook</span>`;
      addCard.addEventListener('click', openAddModal);
      grid.appendChild(addCard);
    }

    function buildTypeGrid() {
      const grid = document.getElementById('typeGrid');
      grid.innerHTML = '';
      NOTEBOOK_TYPES.forEach(t => {
        const opt       = document.createElement('div');
        opt.className   = 'type-opt' + (t.id === selectedType ? ' selected' : '');
        opt.innerHTML   = `<span class="type-opt-emoji">${t.emoji}</span><span class="type-opt-label">${t.label}</span>`;
        opt.addEventListener('click', () => {
          selectedType = t.id;
          document.querySelectorAll('.type-opt').forEach(x => x.classList.remove('selected'));
          opt.classList.add('selected');
        });
        grid.appendChild(opt);
      });
    }

    function buildEmojiPicker() {
      const row = document.getElementById('emojiRow');
      row.innerHTML = '';
      EMOJIS.forEach(em => {
        const opt       = document.createElement('button');
        opt.className   = 'emoji-opt' + (em === selectedEmoji ? ' selected' : '');
        opt.textContent = em;
        opt.type        = 'button';
        opt.addEventListener('click', () => {
          selectedEmoji = em;
          document.querySelectorAll('.emoji-opt').forEach(x => x.classList.remove('selected'));
          opt.classList.add('selected');
        });
        row.appendChild(opt);
      });
    }

    function openActionMenu(e, nbId) {
      contextTarget = nbId;
      document.querySelectorAll('.notebook-card').forEach(c => c.classList.remove('menu-open'));
      const card = document.querySelector(`.notebook-card[data-id="${nbId}"]`);
      if (card) card.classList.add('menu-open');

      const menu    = document.getElementById('actionMenu');
      const btnRect = e.currentTarget.getBoundingClientRect();
      const menuW   = 210, menuH = 110;
      let left = btnRect.right  - menuW;
      let top  = btnRect.bottom + 6;
      if (left < 8)                         left = 8;
      if (left + menuW > window.innerWidth) left = window.innerWidth  - menuW - 8;
      if (top  + menuH > window.innerHeight)top  = btnRect.top - menuH - 6;
      menu.style.left = left + 'px';
      menu.style.top  = top  + 'px';
      menu.classList.add('visible');

      setTimeout(() => document.addEventListener('pointerdown', dismissActionMenu, { once: true }), 50);
    }

    function dismissActionMenu(e) {
      if (document.getElementById('actionMenu').contains(e.target)) return;
      closeActionMenu();
    }

    function closeActionMenu() {
      document.getElementById('actionMenu').classList.remove('visible');
      document.querySelectorAll('.notebook-card').forEach(c => c.classList.remove('menu-open'));
    }

    document.getElementById('menuRename').addEventListener('click', () => {
      closeActionMenu(); setTimeout(openRenameModal, 10);
    });

    document.getElementById('menuDelete').addEventListener('click', () => {
      closeActionMenu(); setTimeout(openDeleteModal, 10);
    });

    function openAddModal() {
      editMode = false; contextTarget = null;
      selectedEmoji = '📓'; selectedType = 'theory';
      document.getElementById('modalTitle').textContent      = 'Add Notebook 📓';
      document.getElementById('modalSubtitle').textContent   = 'Create a notebook for this subject. It supports up to 700 pages.';
      document.getElementById('modalConfirmBtn').textContent = 'Create';
      document.getElementById('notebookNameInput').value     = '';
      document.getElementById('typeSectionLabel').style.display = '';
      document.getElementById('typeGrid').style.display         = '';
      buildTypeGrid();
      buildEmojiPicker();
      document.getElementById('addModal').classList.add('visible');
      setTimeout(() => NotoKeyboard.show(document.getElementById('notebookNameInput')), 300);
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('visible');
      NotoKeyboard.hide();
    }

    async function openRenameModal() {
      if (!contextTarget) return;
      const notebooks = await notoLoadNotebooks(currentSubjectId);
      const nb        = notebooks.find(x => x.id === contextTarget);
      if (!nb) return;
      editMode = true; selectedEmoji = nb.emoji; selectedType = nb.type;
      document.getElementById('modalTitle').textContent      = 'Rename Notebook ✏️';
      document.getElementById('modalSubtitle').textContent   = 'Update the name or cover emoji for this notebook.';
      document.getElementById('modalConfirmBtn').textContent = 'Save';
      document.getElementById('notebookNameInput').value     = nb.name;
      document.getElementById('typeSectionLabel').style.display = 'none';
      document.getElementById('typeGrid').style.display         = 'none';
      buildEmojiPicker();
      document.getElementById('addModal').classList.add('visible');
      setTimeout(() => NotoKeyboard.show(document.getElementById('notebookNameInput')), 300);
    }

    async function confirmNotebook() {
      const name = document.getElementById('notebookNameInput').value.trim();
      if (!name) { notoToast('Please enter a notebook name ✏️'); return; }

      if (editMode && contextTarget) {
        await notoUpdateNotebook(currentSubjectId, contextTarget, { name, emoji: selectedEmoji });
        notoToast('Notebook renamed ✅');
      } else {
        await notoAddNotebook(currentSubjectId, currentGradeId, name, selectedEmoji, selectedType);
        notoToast('Notebook created 📓');
      }
      await render(); closeAddModal();
    }

    function openDeleteModal() {
      document.getElementById('deleteConfirmInput').value  = '';
      document.getElementById('deleteConfirmBtn').disabled = true;
      document.getElementById('deleteModal').classList.add('visible');
      setTimeout(() => NotoKeyboard.show(document.getElementById('deleteConfirmInput')), 300);
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.remove('visible');
      NotoKeyboard.hide();
    }

    async function confirmDelete() {
      if (!contextTarget) return;
      await notoDeleteNotebook(currentSubjectId, currentGradeId, contextTarget);
      await render(); closeDeleteModal();
      notoToast('Notebook deleted 🗑️');
      contextTarget = null;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await notoWaitInit();
      init();
      document.getElementById('deleteConfirmInput').addEventListener('input', function () {
        document.getElementById('deleteConfirmBtn').disabled = this.value.trim().toLowerCase() !== 'delete';
      });
    });
  </script>
</body>
</html>
