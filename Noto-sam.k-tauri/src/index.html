<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Noto</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .loader {
      text-align: center;
      opacity: 0.7;
    }

    .logo {
      font-size: 32px;
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .sub {
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <!-- Minimal boot screen -->
  <div class="loader">
    <div class="logo">Noto</div>
    <div class="sub">Launching...</div>
  </div>

  <script>
    // small delay for smooth feel (optional)
    setTimeout(() => {
      window.location.href = "welcome.html";
    }, 500);
  </script>

</body>
</html>
