<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noto — Subjects</title>

  <!-- ============================================================
       SUBJECT.HTML > FONTS
       ============================================================ -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">

  <style>

    /* ============================================================
       SUBJECT.HTML > CSS RESET & ROOT VARIABLES
       ============================================================ */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    :root {
      --black:        #0a0a0a;
      --white:        #fafafa;
      --gray-50:      #f9f9f9;
      --gray-100:     #f4f4f4;
      --gray-200:     #e8e8e8;
      --gray-300:     #d0d0d0;
      --gray-400:     #b0b0b0;
      --gray-500:     #888888;
      --gray-700:     #444444;
      --danger:       #c0392b;
      --danger-bg:    #fff5f5;
      --font-display: 'DM Serif Display', Georgia, serif;
      --font-body:    'DM Sans', system-ui, sans-serif;
      --radius-sm:    8px;
      --radius-md:    14px;
      --radius-lg:    20px;
      --radius-full:  9999px;
      --shadow-soft:  0 4px 32px rgba(0,0,0,0.08);
      --shadow-card:  0 2px 12px rgba(0,0,0,0.06);
      --shadow-menu:  0 8px 40px rgba(0,0,0,0.14);
      --transition:   all 0.28s cubic-bezier(0.4,0,0.2,1);
      --topbar-h:     72px;
    }

    /* ============================================================
       SUBJECT.HTML > THEME SUPPORT
       ============================================================ */
    [data-theme="dark"] {
      --black:    #f0f0f0;
      --white:    #141414;
      --gray-50:  #1a1a1a;
      --gray-100: #222222;
      --gray-200: #2e2e2e;
      --gray-300: #444444;
      --gray-400: #666666;
      --gray-500: #999999;
      --gray-700: #cccccc;
    }

    [data-theme="sepia"] {
      --white:    #f5f0e8;
      --gray-50:  #ede8e0;
      --gray-100: #e5dfd6;
      --gray-200: #d5cfc6;
    }

    html, body {
      width:100%; height:100%; overflow:hidden;
      background:var(--white); color:var(--black);
      font-family:var(--font-body); -webkit-font-smoothing:antialiased;
    }

    /* ============================================================
       SUBJECT.HTML > APP LAYOUT
       ============================================================ */
    .app { width:100%; height:100%; display:flex; flex-direction:column; overflow:hidden; }

    /* ============================================================
       SUBJECT.HTML > TOP NAVIGATION BAR
       ============================================================ */
    .topbar {
      flex-shrink:0; height:var(--topbar-h);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 32px;
      border-bottom:1px solid var(--gray-200);
      background:var(--white); z-index:100; gap:16px;
    }

    .topbar-left  { display:flex; align-items:center; gap:14px; flex-shrink:0; }
    .topbar-right { display:flex; align-items:center; gap:10px; flex-shrink:0; }

    .back-btn {
      display:flex; align-items:center; gap:7px;
      padding:8px 14px;
      border:1px solid var(--gray-200); border-radius:var(--radius-full);
      background:transparent; font-family:var(--font-body);
      font-size:13px; font-weight:400; color:var(--gray-500);
      cursor:pointer; transition:var(--transition);
    }

    .back-btn:hover { border-color:var(--gray-400); color:var(--black); background:var(--gray-100); }
    .back-btn svg   { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

    /* ============================================================
       SUBJECT.HTML > BREADCRUMB
       ============================================================ */
    .breadcrumb         { display:flex; align-items:center; gap:8px; }
    .breadcrumb-grade   { font-size:13px; color:var(--gray-400); font-weight:300; }
    .breadcrumb-sep     { font-size:13px; color:var(--gray-300); }
    .breadcrumb-current { font-family:var(--font-display); font-size:20px; font-weight:400; color:var(--black); letter-spacing:-0.01em; }

    /* ============================================================
       SUBJECT.HTML > SEARCH BAR
       ============================================================ */
    .search-wrap    { flex:1; max-width:360px; position:relative; }

    .search-input {
      width:100%; padding:10px 16px 10px 40px;
      border:1px solid var(--gray-200); border-radius:var(--radius-full);
      font-family:var(--font-body); font-size:14px; font-weight:300;
      color:var(--black); background:var(--gray-50); outline:none;
      transition:var(--transition);
    }

    .search-input:focus { border-color:var(--black); background:var(--white); box-shadow:0 0 0 3px rgba(0,0,0,0.05); }
    .search-input::placeholder { color:var(--gray-400); }

    .search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(--gray-400); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }

    .icon-btn { width:40px; height:40px; border-radius:var(--radius-full); border:1px solid var(--gray-200); background:var(--white); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:var(--transition); }
    .icon-btn:hover { border-color:var(--gray-400); background:var(--gray-100); }
    .icon-btn svg   { width:17px; height:17px; stroke:var(--gray-500); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:stroke 0.2s; }
    .icon-btn:hover svg { stroke:var(--black); }

    /* ============================================================
       SUBJECT.HTML > MAIN CONTENT
       ============================================================ */
    .main-content { flex:1; overflow-y:auto; padding:32px 40px 120px; scroll-behavior:smooth; }
    .main-content::-webkit-scrollbar       { width:4px; }
    .main-content::-webkit-scrollbar-track { background:transparent; }
    .main-content::-webkit-scrollbar-thumb { background:var(--gray-200); border-radius:2px; }

    .section-header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; }
    .section-label  { font-size:11px; font-weight:400; letter-spacing:0.14em; text-transform:uppercase; color:var(--gray-400); }
    .section-count  { font-size:11px; color:var(--gray-400); }

    /* ============================================================
       SUBJECT.HTML > SUBJECT LIST
       ============================================================ */
    .subjects-list { display:flex; flex-direction:column; gap:10px; }

    /* ============================================================
       SUBJECT.HTML > SUBJECT ROW
       ============================================================ */
    .subject-row {
      position:relative;
      display:flex; align-items:center; gap:16px;
      padding:18px 22px;
      background:var(--white);
      border:1px solid var(--gray-200); border-radius:var(--radius-md);
      cursor:pointer; transition:var(--transition);
      box-shadow:var(--shadow-card);
      animation:rowIn 0.35s cubic-bezier(0.4,0,0.2,1) backwards;
      user-select:none;
    }

    .subject-row:nth-child(1){animation-delay:.04s} .subject-row:nth-child(2){animation-delay:.08s}
    .subject-row:nth-child(3){animation-delay:.12s} .subject-row:nth-child(4){animation-delay:.16s}
    .subject-row:nth-child(5){animation-delay:.20s} .subject-row:nth-child(6){animation-delay:.24s}
    .subject-row:nth-child(7){animation-delay:.28s} .subject-row:nth-child(8){animation-delay:.32s}

    @keyframes rowIn { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:translateX(0)} }

    .subject-row:hover    { border-color:var(--gray-400); box-shadow:var(--shadow-soft); transform:translateX(3px); }
    .subject-row.menu-open { border-color:var(--black); box-shadow:0 0 0 2px var(--black); }

    /* ============================================================
       SUBJECT.HTML > THREE-DOT MENU BUTTON
       ============================================================ */
    .row-menu-btn {
      position:absolute; top:50%; right:14px;
      transform:translateY(-50%);
      width:32px; height:32px;
      border-radius:var(--radius-full);
      border:none; background:transparent;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:var(--transition);
      opacity:0; z-index:10; flex-shrink:0;
    }

    @media (hover:none) { .row-menu-btn { opacity:1; } }

    .subject-row:hover .row-menu-btn,
    .subject-row.menu-open .row-menu-btn { opacity:1; }

    .row-menu-btn:hover { background:var(--gray-100); }
    .row-menu-btn svg   { width:15px; height:15px; stroke:var(--gray-500); fill:none; stroke-width:2; stroke-linecap:round; transition:stroke 0.2s; }
    .row-menu-btn:hover svg { stroke:var(--black); }

    /* ============================================================
       SUBJECT.HTML > SUBJECT ICON
       ============================================================ */
    .subject-icon { width:48px; height:48px; border-radius:var(--radius-md); background:var(--gray-100); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; transition:var(--transition); }
    .subject-row:hover .subject-icon { background:var(--gray-200); }

    /* ============================================================
       SUBJECT.HTML > SUBJECT INFO
       ============================================================ */
    .subject-info  { flex:1; min-width:0; padding-right:36px; }
    .subject-name  { font-size:16px; font-weight:500; color:var(--black); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px; }
    .subject-meta  { font-size:12px; color:var(--gray-400); font-weight:300; }

    /* ============================================================
       SUBJECT.HTML > ROW RIGHT SIDE
       ============================================================ */
    .subject-right  { display:flex; align-items:center; gap:10px; flex-shrink:0; padding-right:40px; }

    .notebook-count { font-size:12px; color:var(--gray-400); padding:4px 10px; background:var(--gray-100); border-radius:var(--radius-full); }

    .row-arrow { width:28px; height:28px; border-radius:var(--radius-full); background:var(--gray-100); display:flex; align-items:center; justify-content:center; transition:var(--transition); }
    .subject-row:hover .row-arrow { background:var(--black); }
    .row-arrow svg { width:12px; height:12px; stroke:var(--gray-500); fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; transition:stroke 0.2s; }
    .subject-row:hover .row-arrow svg { stroke:var(--white); }

    /* ============================================================
       SUBJECT.HTML > ADD SUBJECT ROW (DASHED)
       ============================================================ */
    .subject-row-add {
      display:flex; align-items:center; justify-content:center; gap:10px;
      padding:16px 22px;
      border:1.5px dashed var(--gray-300); border-radius:var(--radius-md);
      cursor:pointer; transition:var(--transition);
      color:var(--gray-500); font-size:14px; font-weight:400;
    }

    .subject-row-add:hover { border-color:var(--black); color:var(--black); background:var(--gray-50); }
    .subject-row-add svg   { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; }

    /* ============================================================
       SUBJECT.HTML > DROPDOWN ACTION MENU
       ============================================================ */
    .action-menu { position:fixed; background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-md); box-shadow:var(--shadow-menu); padding:6px; z-index:2000; min-width:200px; display:none; animation:menuPop 0.18s cubic-bezier(0.4,0,0.2,1); transform-origin:top right; }
    .action-menu.visible { display:block; }
    @keyframes menuPop { from{opacity:0;transform:scale(0.92)} to{opacity:1;transform:scale(1)} }

    .action-item { display:flex; align-items:center; gap:11px; padding:11px 14px; border-radius:var(--radius-sm); font-size:14px; font-weight:400; color:var(--black); cursor:pointer; transition:background 0.15s; border:none; background:none; width:100%; text-align:left; font-family:var(--font-body); }
    .action-item:hover        { background:var(--gray-100); }
    .action-item.danger       { color:var(--danger); }
    .action-item.danger:hover { background:var(--danger-bg); }
    .action-item svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .action-divider { height:1px; background:var(--gray-200); margin:5px 0; }

    /* ============================================================
       SUBJECT.HTML > MODAL SYSTEM
       ============================================================ */
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:500; display:none; align-items:center; justify-content:center; backdrop-filter:blur(3px); }
    .modal-backdrop.visible { display:flex; }
    .modal { background:var(--white); border-radius:var(--radius-lg); padding:32px; width:440px; max-width:92vw; box-shadow:0 24px 64px rgba(0,0,0,0.18); animation:modalIn 0.25s cubic-bezier(0.4,0,0.2,1); }
    @keyframes modalIn { from{opacity:0;transform:scale(0.96) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }

    .modal-title    { font-family:var(--font-display); font-size:22px; font-weight:400; margin-bottom:6px; color:var(--black); }
    .modal-subtitle { font-size:13px; color:var(--gray-500); margin-bottom:24px; line-height:1.6; }

    /* ============================================================
       SUBJECT.HTML > FORM INPUTS
       ============================================================ */
    .input-group  { margin-bottom:16px; }
    .input-label  { display:block; font-size:11px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--gray-500); margin-bottom:8px; }
    .input-field  { width:100%; padding:13px 16px; border:1px solid var(--gray-200); border-radius:var(--radius-md); font-family:var(--font-body); font-size:15px; font-weight:400; color:var(--black); background:var(--white); outline:none; transition:border-color 0.2s; caret-color:var(--black); }
    .input-field:focus        { border-color:var(--black); }
    .input-field::placeholder { color:var(--gray-400); }

    /* ============================================================
       SUBJECT.HTML > EMOJI PICKER
       ============================================================ */
    .emoji-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
    .emoji-opt { width:44px; height:44px; border-radius:var(--radius-sm); border:1.5px solid var(--gray-200); background:var(--gray-50); font-size:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:var(--transition); }
    .emoji-opt:hover, .emoji-opt.selected { border-color:var(--black); background:var(--gray-100); transform:scale(1.08); }

    /* ============================================================
       SUBJECT.HTML > MODAL BUTTONS
       ============================================================ */
    .modal-actions  { display:flex; gap:10px; justify-content:flex-end; margin-top:4px; }
    .btn-secondary  { padding:11px 22px; border:1px solid var(--gray-200); border-radius:var(--radius-full); background:var(--white); font-family:var(--font-body); font-size:13px; font-weight:500; color:var(--gray-700); cursor:pointer; transition:var(--transition); }
    .btn-secondary:hover { border-color:var(--gray-400); background:var(--gray-100); }
    .btn-confirm    { padding:11px 22px; border:none; border-radius:var(--radius-full); background:var(--black); font-family:var(--font-body); font-size:13px; font-weight:500; color:var(--white); cursor:pointer; transition:var(--transition); }
    .btn-confirm:hover { background:var(--gray-700); }
    .btn-danger     { padding:11px 22px; border:none; border-radius:var(--radius-full); background:var(--danger); font-family:var(--font-body); font-size:13px; font-weight:500; color:var(--white); cursor:pointer; transition:var(--transition); }
    .btn-danger:hover    { background:#a93226; }
    .btn-danger:disabled { opacity:0.4; cursor:not-allowed; }

    /* ============================================================
       SUBJECT.HTML > DELETE NOTE
       ============================================================ */
    .delete-note        { font-size:13px; color:var(--gray-500); margin-bottom:12px; line-height:1.6; }
    .delete-note strong { color:var(--danger); font-weight:600; }

    /* ============================================================
       SUBJECT.HTML > EMPTY & NO-RESULTS STATES
       ============================================================ */
    .empty-state      { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; text-align:center; color:var(--gray-400); }
    .empty-state-icon { font-size:48px; margin-bottom:16px; }
    .empty-state-text { font-size:14px; font-weight:300; line-height:1.7; }
    .no-results       { text-align:center; padding:40px 20px; color:var(--gray-400); font-size:14px; font-weight:300; }

    /* ============================================================
       SUBJECT.HTML > TOAST
       ============================================================ */
    .toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--black); color:var(--white); font-size:13px; padding:12px 22px; border-radius:var(--radius-full); z-index:9999; opacity:0; transition:all 0.3s cubic-bezier(0.4,0,0.2,1); pointer-events:none; white-space:nowrap; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ============================================================
       SUBJECT.HTML > PAGE TRANSITION OVERLAY
       ============================================================ */
    .transition-overlay { position:fixed; inset:0; background:var(--black); z-index:99998; transform:translateY(-200%); transition:transform 0.5s cubic-bezier(0.7,0,0.3,1); pointer-events:none; }
    .transition-overlay.active { transform:translateY(0%); pointer-events:all; }

  </style>
</head>
<body>

  <!-- ============================================================
       SUBJECT.HTML > PAGE TRANSITION OVERLAY
       ============================================================ -->
  <div class="transition-overlay" id="transitionOverlay"></div>

  <!-- ============================================================
       SUBJECT.HTML > DROPDOWN ACTION MENU
       ============================================================ -->
  <div class="action-menu" id="actionMenu">
    <button class="action-item" id="menuRename">
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Rename
    </button>
    <div class="action-divider"></div>
    <button class="action-item danger" id="menuDelete">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      Delete Subject
    </button>
  </div>

  <!-- ============================================================
       SUBJECT.HTML > ADD / RENAME MODAL
       ============================================================ -->
  <div class="modal-backdrop" id="addModal">
    <div class="modal">
      <h2 class="modal-title"    id="modalTitle">Add Subject 📚</h2>
      <p  class="modal-subtitle" id="modalSubtitle">Add a subject to organise your notebooks inside this grade.</p>
      <div class="input-group">
        <label class="input-label">Subject Name</label>
        <input class="input-field" id="subjectNameInput" type="text"
               placeholder="e.g. Physics, History, Music…"
               maxlength="40" data-osk="true" autocomplete="off" />
      </div>
      <label class="input-label">Pick an Emoji</label>
      <div class="emoji-row" id="emojiRow"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeAddModal()">Cancel</button>
        <button class="btn-confirm"   id="modalConfirmBtn" onclick="confirmSubject()">Create</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       SUBJECT.HTML > DELETE CONFIRMATION MODAL
       ============================================================ -->
  <div class="modal-backdrop" id="deleteModal">
    <div class="modal">
      <h2 class="modal-title">Delete Subject 🗑️</h2>
      <p  class="modal-subtitle">This permanently removes the subject and all notebooks inside it. This cannot be undone.</p>
      <p  class="delete-note">Type <strong>delete</strong> below to confirm.</p>
      <div class="input-group">
        <input class="input-field" id="deleteConfirmInput" type="text"
               placeholder="Type delete to confirm…"
               data-osk="true" autocomplete="off" />
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn-danger" id="deleteConfirmBtn" onclick="confirmDelete()" disabled>Delete</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       SUBJECT.HTML > TOAST
       ============================================================ -->
  <div class="toast" id="toast"></div>

  <!-- ============================================================
       SUBJECT.HTML > APP SHELL
       ============================================================ -->
  <div class="app">

    <header class="topbar">
      <div class="topbar-left">
        <button class="back-btn" onclick="notoNavigate('grade.html')">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          Grades
        </button>
        <div class="breadcrumb">
          <span class="breadcrumb-grade"   id="gradeName">—</span>
          <span class="breadcrumb-sep">›</span>
          <span class="breadcrumb-current">Subjects</span>
        </div>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="searchInput" type="text"
               placeholder="Search subjects…" oninput="handleSearch()"
               data-osk="true" autocomplete="off" />
      </div>

      <div class="topbar-right">
        <button class="icon-btn" onclick="openAddModal()" title="Add Subject">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="icon-btn" onclick="notoNavigate('settings.html')" title="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <main class="main-content">
      <div class="section-header">
        <span class="section-label">📚 Subjects</span>
        <span class="section-count" id="subjectCount">0 subjects</span>
      </div>
      <div class="subjects-list" id="subjectsList"></div>
    </main>

  </div>

  <!-- ============================================================
       SUBJECT.HTML > RENDERER.JS + KEYBOARD.JS
       ============================================================ -->
  <script src="renderer.js"></script>
  <script src="keyboard.js"></script>

  <!-- ============================================================
       SUBJECT.HTML > JAVASCRIPT — PAGE STATE
       ============================================================ -->
  <script>
    // Read current grade from session via renderer.js
    const currentGradeId = notoGetCurrentGrade();

    let selectedEmoji = '📖';
    let editMode      = false;
    let contextTarget = null;   // subject ID targeted by the action menu
    let searchQuery   = '';

    const EMOJIS = ['📖','🔬','📐','✏️','🌍','🧮','🎨','🎵','💻','⚗️','🧬','📊','🏛️','📝','🔭'];

    // Populate breadcrumb grade name
    const grades     = notoLoadGrades();
    const gradeObj   = grades.find(g => g.id === currentGradeId);
    if (gradeObj) document.getElementById('gradeName').textContent = gradeObj.name;
  </script>

  <!-- ============================================================
       SUBJECT.HTML > JAVASCRIPT — RENDER SYSTEM
       Uses notoLoadSubjects() from renderer.js
       ============================================================ -->
  <script>
    async function render() {
      const subjects  = await notoLoadSubjects(currentGradeId);
      const container = document.getElementById('subjectsList');
      const count     = document.getElementById('subjectCount');

      count.textContent = subjects.length + (subjects.length === 1 ? ' subject' : ' subjects');
      container.innerHTML = '';

      // Apply search filter
      const filtered = searchQuery
        ? subjects.filter(s => s.name.toLowerCase().includes(searchQuery))
        : subjects;

      if (subjects.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📂</div>
            <div class="empty-state-text">No subjects yet.<br>Tap the + button to add your first subject.</div>
          </div>`;
        return;
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="no-results">No subjects match your search.</div>`;
        appendAddRow(container);
        return;
      }

      filtered.forEach(subject => {
        const row       = document.createElement('div');
        row.className   = 'subject-row';
        row.dataset.id  = subject.id;

        row.innerHTML = `
          <!-- Three-dot menu button -->
          <button class="row-menu-btn" data-id="${subject.id}" title="Options">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="5"  r="1.2" fill="currentColor" stroke="none"/>
              <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
              <circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/>
            </svg>
          </button>

          <div class="subject-icon">${subject.emoji}</div>

          <div class="subject-info">
            <div class="subject-name">${notoEsc(subject.name)}</div>
            <div class="subject-meta">Last edited ${subject.lastEdited || 'never'}</div>
          </div>

          <div class="subject-right">
            <span class="notebook-count">${subject.notebooks || 0} notebooks</span>
            <div class="row-arrow">
              <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </div>
          </div>`;

        // Navigate into subject on row click
        row.addEventListener('click', e => {
          if (e.target.closest('.row-menu-btn')) return;
          notoSetCurrentSubject(subject.id);
          notoNavigate('notebook.html');
        });

        // Three-dot button opens action menu
        row.querySelector('.row-menu-btn').addEventListener('click', e => {
          e.stopPropagation();
          openActionMenu(e, subject.id);
        });

        container.appendChild(row);
      });

      appendAddRow(container);
    }

    function appendAddRow(container) {
      const addRow       = document.createElement('div');
      addRow.className   = 'subject-row-add';
      addRow.innerHTML   = `
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Subject`;
      addRow.addEventListener('click', openAddModal);
      container.appendChild(addRow);
    }
  </script>

  <!-- ============================================================
       SUBJECT.HTML > JAVASCRIPT — SEARCH SYSTEM
       ============================================================ -->
  <script>
    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      render();
    }
  </script>

  <!-- ============================================================
       SUBJECT.HTML > JAVASCRIPT — EMOJI PICKER
       ============================================================ -->
  <script>
    function buildEmojiPicker() {
      const row = document.getElementById('emojiRow');
      row.innerHTML = '';
      EMOJIS.forEach(em => {
        const opt       = document.createElement('button');
        opt.className   = 'emoji-opt' + (em === selectedEmoji ? ' selected' : '');
        opt.textContent = em;
        opt.type        = 'button';
        opt.addEventListener('click', () => {
          selectedEmoji = em;
          document.querySelectorAll('.emoji-opt').forEach(x => x.classList.remove('selected'));
          opt.classList.add('selected');
        });
        row.appendChild(opt);
      });
    }
  </script>

  <!-- ============================================================
       SUBJECT.HTML > JAVASCRIPT — ACTION MENU SYSTEM
       ============================================================ -->
  <script>
    function openActionMenu(e, subjectId) {
      contextTarget = subjectId;

      document.querySelectorAll('.subject-row').forEach(r => r.classList.remove('menu-open'));
      const row = document.querySelector(`.subject-row[data-id="${subjectId}"]`);
      if (row) row.classList.add('menu-open');

      const menu    = document.getElementById('actionMenu');
      const btnRect = e.currentTarget.getBoundingClientRect();
      const menuW   = 210, menuH = 110;
      let left = btnRect.right  - menuW;
      let top  = btnRect.bottom + 6;
      if (left < 8)                         left = 8;
      if (left + menuW > window.innerWidth) left = window.innerWidth  - menuW - 8;
      if (top  + menuH > window.innerHeight)top  = btnRect.top - menuH - 6;
      menu.style.left = left + 'px';
      menu.style.top  = top  + 'px';
      menu.classList.add('visible');

      setTimeout(() => {
        document.addEventListener('pointerdown', dismissActionMenu, { once: true });
      }, 50);
    }

    function dismissActionMenu(e) {
      if (document.getElementById('actionMenu').contains(e.target)) return;
      closeActionMenu();
    }

    function closeActionMenu() {
      document.getElementById('actionMenu').classList.remove('visible');
      document.querySelectorAll('.subject-row').forEach(r => r.classList.remove('menu-open'));
    }

    document.getElementById('menuRename').addEventListener('click', () => {
      closeActionMenu(); setTimeout(openRenameModal, 10);
    });

    document.getElementById('menuDelete').addEventListener('click', () => {
      closeActionMenu(); setTimeout(openDeleteModal, 10);
    });
  </script>

  <!-- ============================================================
       SUBJECT.HTML > JAVASCRIPT — ADD / RENAME MODAL
       Uses notoAddSubject() and notoUpdateSubject() from renderer.js
       ============================================================ -->
  <script>
    function openAddModal() {
      editMode = false; contextTarget = null;
      selectedEmoji = '📖';
      document.getElementById('modalTitle').textContent      = 'Add Subject 📚';
      document.getElementById('modalSubtitle').textContent   = 'Add a subject to organise your notebooks inside this grade.';
      document.getElementById('modalConfirmBtn').textContent = 'Create';
      document.getElementById('subjectNameInput').value      = '';
      buildEmojiPicker();
      document.getElementById('addModal').classList.add('visible');
      setTimeout(() => NotoKeyboard.show(document.getElementById('subjectNameInput')), 300);
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('visible');
      NotoKeyboard.hide();
    }

    async function openRenameModal() {
      if (!contextTarget) return;
      const subjects = await notoLoadSubjects(currentGradeId);
      const s        = subjects.find(x => x.id === contextTarget);
      if (!s) return;
      editMode = true; selectedEmoji = s.emoji;
      document.getElementById('modalTitle').textContent      = 'Rename Subject ✏️';
      document.getElementById('modalSubtitle').textContent   = 'Update the name or emoji for this subject.';
      document.getElementById('modalConfirmBtn').textContent = 'Save';
      document.getElementById('subjectNameInput').value      = s.name;
      buildEmojiPicker();
      document.getElementById('addModal').classList.add('visible');
      setTimeout(() => NotoKeyboard.show(document.getElementById('subjectNameInput')), 300);
    }

    async function confirmSubject() {
      const name = document.getElementById('notebookNameInput').value.trim();
      if (!name) { notoToast('Please enter a subject name ✏️'); return; }

      if (editMode && contextTarget) {
        await notoUpdateSubject(currentGradeId, contextTarget, { name, emoji: selectedEmoji });
        notoToast('Subject renamed ✅');
      } else {
        await notoAddSubject(currentGradeId, name, selectedEmoji);
        notoToast('Subject created 📚');
      }
      render(); closeAddModal();
    }
  </script>

  <!-- ============================================================
       SUBJECT.HTML > JAVASCRIPT — DELETE SYSTEM
       Uses notoDeleteSubject() from renderer.js
       ============================================================ -->
  <script>
    function openDeleteModal() {
      document.getElementById('deleteConfirmInput').value  = '';
      document.getElementById('deleteConfirmBtn').disabled = true;
      document.getElementById('deleteModal').classList.add('visible');
      setTimeout(() => NotoKeyboard.show(document.getElementById('deleteConfirmInput')), 300);
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.remove('visible');
      NotoKeyboard.hide();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('deleteConfirmInput').addEventListener('input', function () {
        document.getElementById('deleteConfirmBtn').disabled =
          this.value.trim().toLowerCase() !== 'delete';
      });
    });

    async function confirmDelete() {
      if (!contextTarget) return;
      await notoDeleteSubject(currentGradeId, contextTarget);
      render(); closeDeleteModal();
      notoToast('Subject deleted 🗑️');
      contextTarget = null;
    }
  </script>

  <!-- ============================================================
       SUBJECT.HTML > JAVASCRIPT — INIT
       ============================================================ -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await notoWaitInit();
      if (!currentGradeId) { notoNavigate('grade.html'); return; }
      render();
    });
  </script>

</body>
</html>
